name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in sync with mitraVersion in flake.nix
  MITRA_VERSION: "5.10.0"

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Same harness as local runs: throwaway Postgres (from the runner's
  # preinstalled PostgreSQL) -> Mitra from the pinned upstream deb ->
  # seeded through the app's own API client -> Playwright.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Expose PostgreSQL tools (initdb/pg_ctl)
        run: echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - name: Install pinned Mitra server
        run: |
          curl -sL -o /tmp/mitra.deb \
            "https://codeberg.org/silverpill/mitra/releases/download/v${MITRA_VERSION}/mitra_${MITRA_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/mitra.deb
          mitra --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        env:
          MITRA_BIN: /usr/bin/mitra
        run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build .#rvmf .#mitra
      - run: nix flake check
